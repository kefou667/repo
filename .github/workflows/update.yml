name: 更新并发布源

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'icons/**'
      - 'update_packages.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 生成源索引
        run: python3 update_packages.py

      - name: 提交自动生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add Packages Packages.gz Packages.bz2 sileo.json news.json depictions icons

          if git diff --staged --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "🤖 自动更新源索引"
            git push
          fi

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 准备 Pages 文件
        run: |
          mkdir -p _site

          cp -r debs _site/
          cp -r depictions _site/
          cp -r icons _site/

          cp Packages _site/
          cp Packages.gz _site/
          cp Packages.bz2 _site/
          cp sileo.json _site/
          cp news.json _site/

          echo "Pages 文件准备完成"
          find _site -maxdepth 2 -type f | sort

      - name: 上传 Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./_site

      - name: 发布到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
