name: 更新源索引

on:
  push:
    branches: [main]
    paths:
      - 'debs/**'
      - 'update_packages.py'
      - '.github/workflows/update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 生成 Packages、Depiction
        run: python3 update_packages.py

      - name: 提交自动生成文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.gz Packages.bz2 sileo.json depictions icons
          if git diff --staged --quiet; then
            echo "没有需要提交的变化"
          else
            git commit -m "🤖 自动更新源索引"
            git push
          fi
