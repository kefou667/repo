<!doctype html>
<html lang="zh-CN">
<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1"
>

<title>StoreSwitchAccounts - kefou</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 24px 16px 50px;

    background:
        linear-gradient(
            180deg,
            #f7f7fb 0%,
            #f2f2f7 100%
        );

    color: #1c1c1e;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "SF Pro Text",
        "Helvetica Neue",
        sans-serif;
}

.container {
    max-width: 700px;
    margin: 0 auto;
}

.card {
    background: rgba(255,255,255,.94);

    border-radius: 28px;

    padding: 28px;

    box-shadow:
        0 12px 40px rgba(0,0,0,.08);

    border: 1px solid rgba(0,0,0,.04);
}

.hero {
    text-align: center;

    padding: 10px 0 8px;
}

.hero-icon {
    width: 104px;
    height: 104px;

    border-radius: 24px;

    object-fit: cover;

    display: block;

    margin: 0 auto 18px;

    box-shadow:
        0 10px 28px rgba(0,0,0,.14);
}

h1 {
    margin: 0;

    font-size: 30px;

    line-height: 1.2;

    font-weight: 750;

    letter-spacing: -.5px;
}

.version {
    margin-top: 8px;

    color: #777985;

    font-size: 14px;
}

.badges {
    display: flex;

    justify-content: center;

    flex-wrap: wrap;

    gap: 8px;

    margin-top: 16px;
}

.badge {
    display: inline-flex;

    align-items: center;

    padding: 7px 12px;

    border-radius: 999px;

    background: #f0edff;

    color: #6848d8;

    font-size: 13px;

    font-weight: 650;
}

.description {
    margin-top: 28px;

    padding: 20px;

    background: #f7f7fa;

    border-radius: 18px;

    color: #44444a;

    font-size: 15px;

    line-height: 1.7;
}

.section-title {
    margin: 28px 0 14px;

    font-size: 17px;

    font-weight: 700;
}

.info {
    overflow: hidden;

    border-radius: 18px;

    background: #f7f7fa;
}

.row {
    display: grid;

    grid-template-columns: 90px 1fr;

    gap: 14px;

    padding: 14px 16px;

    border-bottom:
        1px solid rgba(0,0,0,.06);

    font-size: 14px;
}

.row:last-child {
    border-bottom: 0;
}

.label {
    color: #88888f;
}

.value {
    color: #222226;

    word-break: break-word;
}

.links {
    display: flex;

    flex-wrap: wrap;

    gap: 10px;

    margin-top: 26px;
}

.button {
    flex: 1;

    min-width: 130px;

    display: inline-flex;

    justify-content: center;

    align-items: center;

    padding: 13px 16px;

    border-radius: 14px;

    text-decoration: none;

    font-size: 14px;

    font-weight: 650;
}

.button.primary {
    background: #6d4aff;

    color: white;
}

.button.secondary {
    background: #f1f1f5;

    color: #333338;
}

.footer {
    margin-top: 24px;

    text-align: center;

    color: #9999a1;

    font-size: 12px;

    line-height: 1.6;
}

.footer a {
    color: #6d4aff;

    text-decoration: none;
}

@media (max-width: 520px) {

    body {
        padding:
            12px 10px 35px;
    }

    .card {
        padding:
            22px 18px;

        border-radius: 24px;
    }

    .hero-icon {
        width: 92px;
        height: 92px;

        border-radius: 22px;
    }

    h1 {
        font-size: 27px;
    }

    .row {
        grid-template-columns:
            75px 1fr;
    }

}

</style>

</head>

<div class="container">

            <div class="row">

            </div>

        </div>


        <div class="links">

            <a

            <a

            </a>

        </div>

    </div>


    <div class="footer">

        <div>
            StoreSwitchAccounts · kefou
        </div>

        <div>

            Powered by

            <a href="https://repo.xxtt.pp.ua//">
                kefou Repository
            </a>

        </div>

    </div>

</div>

</body>
</html>
